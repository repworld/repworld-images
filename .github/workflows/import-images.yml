name: Import Drive images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download images from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          download() {
            id="$1"
            out="$2"
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
          }
          download "1TUjbZg456tMsRU6U8L8Byz8iEfRp-Bar" "images/img-001.png"
