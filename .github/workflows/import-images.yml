name: Sync Google Drive images

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-images.yml'
      - 'sync_drive.py'

permissions:
  contents: write

concurrency:
  group: repworld-drive-image-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive downloader
        run: python -m pip install --upgrade 'gdown>=6.1.0'

      - name: Sync only new Google Drive images
        env:
          DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1gIXVgKN1j50Tf-6Z_eSA8gYI2JwylmnR
        run: python sync_drive.py

      - name: Commit new images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ images.json known_drive_ids.txt
          if git diff --cached --quiet; then
            echo "No new images to publish"
            exit 0
          fi
          git commit -m "Sync new images from Google Drive"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
