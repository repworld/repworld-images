name: Sync Google Drive images

# Automatic sync: every 5 minutes, staggered away from common :00/:15/:30/:45 load peaks.
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-images.yml'
      - 'sync_drive.py'

permissions:
  contents: write

concurrency:
  group: repworld-drive-image-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Drive downloader
        run: python -m pip install --upgrade 'gdown>=6.0.0'

      - name: Download current Google Drive folder
        env:
          DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1gIXVgKN1j50Tf-6Z_eSA8gYI2JwylmnR
        run: |
          set -euo pipefail
          rm -rf incoming
          python - <<'PY'
          import os
          import gdown

          url = os.environ['DRIVE_FOLDER_URL']
          result = gdown.download_folder(url=url, output='incoming', quiet=False)
          if not result:
              raise SystemExit('Google Drive folder returned no downloadable files')
          print(f'Downloaded {len(result)} files from Drive')
          PY

      - name: Add only new images and rebuild manifest
        run: python sync_drive.py

      - name: Commit new images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ images.json
          if git diff --cached --quiet; then
            echo "No new images to publish"
            exit 0
          fi
          git commit -m "Sync new images from Google Drive"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
