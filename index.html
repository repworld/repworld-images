<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repworld Image Host</title>
<meta name="robots" content="index,follow">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#0d0d0f;color:#fff}header{position:sticky;top:0;background:#0d0d0fef;padding:18px 22px;border-bottom:1px solid #2a2a2e;backdrop-filter:blur(12px);z-index:2}.wrap{max-width:1400px;margin:auto}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 18px 0 0}.count{color:#aaa}input{flex:1;min-width:240px;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#17171a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:22px}.card{background:#17171a;border:1px solid #2a2a2e;border-radius:14px;overflow:hidden}.thumb{aspect-ratio:1/1;background:#111;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.meta{padding:12px}.name{font-size:12px;color:#c9c9cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}.actions{display:flex;gap:8px}.actions button,.actions a{flex:1;text-align:center;background:#242428;border:1px solid #39393f;color:#fff;padding:8px;border-radius:8px;text-decoration:none;font-size:12px;cursor:pointer}.actions button:hover,.actions a:hover{background:#303037}.note{font-size:12px;color:#999;margin-top:8px}
</style></head><body>
<header><div class="wrap top"><h1>REPWORLD IMAGE HOST</h1><span class="count" id="count"></span><input id="q" placeholder="Szukaj np. img-014..."></div></header>
<div class="wrap" style="padding:14px 22px 0;color:#9fa0a8;font-size:12px">65 zdjęć hostowanych bezpośrednio w repozytorium GitHub. Kliknij „Kopiuj URL”, aby skopiować publiczny adres obrazka.</div>
<main class="wrap"><div class="grid" id="grid"></div></main>
<script>
const total=65;
const data=Array.from({length:total},(_,i)=>{const n=String(i+1).padStart(3,'0');return {alias:`img-${n}.png`,path:`images/img-${n}.png`}});
const grid=document.getElementById('grid'),q=document.getElementById('q'),count=document.getElementById('count');
function absoluteUrl(path){return new URL(path,location.href).href}
function render(){const s=q.value.toLowerCase();const arr=data.filter(x=>x.alias.includes(s));count.textContent=arr.length+' zdjęć';grid.innerHTML=arr.map(x=>`<div class="card"><div class="thumb"><img loading="lazy" src="${x.path}" alt="${x.alias}"></div><div class="meta"><div class="name">${x.alias}</div><div class="actions"><button data-path="${x.path}">Kopiuj URL</button><a href="${x.path}" target="_blank">Otwórz</a></div><div class="note">${x.path}</div></div></div>`).join('');grid.querySelectorAll('button[data-path]').forEach(btn=>btn.onclick=()=>navigator.clipboard.writeText(absoluteUrl(btn.dataset.path)).then(()=>btn.textContent='Skopiowano'))}
q.addEventListener('input',render);render();
</script></body></html>
